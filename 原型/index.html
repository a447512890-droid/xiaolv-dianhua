<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7f5">
  <title>待办电话 · 联系人沟通需求原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="workspace-header">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">待</span><div><strong>待办电话</strong><small>联系人沟通需求原型</small></div></div>
      <div class="header-meta"><span class="meta-pill">需求原型</span></div>
      <button class="mobile-spec-toggle module-link" type="button" data-action="toggle-spec" aria-label="展开或收起模块说明" aria-controls="spec-panel" aria-expanded="false"><span class="annotation-dot" aria-hidden="true"></span></button>
    </header>

    <div class="workspace-grid">
      <aside class="journey" aria-label="原型导航">
        <div class="doc-brand"><span>PRODUCT MAP</span><strong>待办电话 · 需求原型</strong></div>
        <nav id="journey-nav" class="journey-nav" aria-label="页面导航"></nav>
      </aside>

      <main class="stage" id="main-content">
        <div class="stage-header"><div><span class="eyebrow" id="stage-kicker">沟通 / 拨号</span><h2 id="stage-title">拨号</h2><p id="stage-description">输入号码，点击呼叫。</p></div></div>
        <div id="document-content" class="document-content" aria-live="polite"></div>
        <div id="workspace-state-tabs" class="workspace-state-tabs-host" aria-label="原型状态切换"></div>
        <div class="phone-wrap"><div class="phone-frame"><div class="phone-screen"><div class="phone-status" aria-hidden="true"><span>9:41</span><span class="dynamic-island"></span><span class="status-icons">●●● ▰</span></div><div id="phone-content" class="phone-content"></div><div class="home-indicator" aria-hidden="true"></div></div></div></div>
      </main>

      <aside class="spec-panel" id="spec-panel" aria-hidden="true" inert aria-label="需求说明面板"><div class="spec-top"><div><span class="eyebrow">REQUIREMENT NOTES</span><h2>模块需求说明</h2></div><button type="button" class="spec-close" data-action="close-spec" aria-label="关闭需求说明">×</button></div><p class="spec-hint">内容取自《docs/产品需求/需求说明.md》，并按页面映射到界面模块。</p><div id="spec-module-list" class="spec-module-list"></div><div id="spec-detail" class="spec-detail"></div><div class="spec-footer">产品规格草案 · 未定能力保留“待确认”标记</div></aside>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="requirements-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
